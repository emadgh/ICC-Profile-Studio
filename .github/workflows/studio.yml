name: Studio GPUI preview
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'build.rs'
      - 'assets/**'
      - '.github/workflows/studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test LittleCMS inspection and ICC backend
        run: cargo test --lib --release --target x86_64-pc-windows-msvc
      - name: Build GPUI preview
        run: cargo build --release --features studio --bin icc-profile-studio --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: ICC-Profile-Studio-GPUI-preview
          path: target/x86_64-pc-windows-msvc/release/icc-profile-studio.exe
          if-no-files-found: error
