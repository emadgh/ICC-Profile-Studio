name: ICC Profile Studio Windows x64
on:
  # Explicit CI request after a batch of commits; no build on each push/synchronize.
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish a Studio prerelease after tests
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  studio:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:run'
    concurrency:
      group: studio-windows-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          targets: x86_64-pc-windows-msvc
      - name: Fetch and verify CIE spectral tables
        shell: pwsh
        run: ./scripts/fetch-cie.ps1
      - name: Test LittleCMS inspection and ICC backend
        env:
          REQUIRE_CIE_DATA: '1'
        run: cargo test --locked --lib --no-default-features --release --target x86_64-pc-windows-msvc
      - name: Build GPUI preview
        run: cargo build --locked --release --bin icc-profile-studio --target x86_64-pc-windows-msvc
      - name: Package Studio preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path studio-dist -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/icc-profile-studio.exe studio-dist/ICC-Profile-Studio.exe
          $hash = (Get-FileHash studio-dist/ICC-Profile-Studio.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ICC-Profile-Studio.exe" | Set-Content -Encoding ascii studio-dist/ICC-Profile-Studio.exe.sha256
          Copy-Item README.md,ROADMAP.md,PROFILE_WORKFLOW.md,CIE_DATA.md,STUDIO_VERSION,RELEASE_QA.md studio-dist/
          $version = (Get-Content STUDIO_VERSION -Raw).Trim()
          $source = (git rev-parse HEAD).Trim()
          $lock = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version=$version;source_commit=$source;lock_sha256=$lock;exe_sha256=$hash;target='x86_64-pc-windows-msvc';rustc=(rustc --version);run_id=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content -Encoding utf8 studio-dist/BUILD_INFO.json
          Compress-Archive -Path studio-dist/* -DestinationPath ICC-Profile-Studio-Windows-x64.zip
      - name: Verify packaged executable and archive
        shell: pwsh
        run: ./scripts/verify-studio-package.ps1 -Archive ICC-Profile-Studio-Windows-x64.zip -Version (Get-Content STUDIO_VERSION -Raw).Trim()
      - name: Publish separate Studio prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content STUDIO_VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+-beta\.\d+(\.\d+)?$') { throw "Expected Studio beta version" }
          $tag = "studio-v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Immutable Studio version exists; increment STUDIO_VERSION" }
          gh release create $tag studio-dist/ICC-Profile-Studio.exe studio-dist/ICC-Profile-Studio.exe.sha256 ICC-Profile-Studio-Windows-x64.zip --target $env:GITHUB_SHA --prerelease --latest=false --title "ICC Profile Studio $version" --notes "Windows x64 preview. Automated tests passed; production printer and interactive runtime validation pending. ICC-only GPUI application."
          if ($LASTEXITCODE -ne 0) { throw "Studio preview publication failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ICC-Profile-Studio-GPUI-preview
          path: ICC-Profile-Studio-Windows-x64.zip
          retention-days: 7
          if-no-files-found: error
