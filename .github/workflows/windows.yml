name: Windows x64 build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test ICC engine
        run: cargo test --release --target x86_64-pc-windows-msvc
      - name: Build portable application
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Stage portable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/color-convert-rust.exe dist/ICC-Profile-Rebuilder.exe
          Copy-Item README.md dist/
          $hash = (Get-FileHash dist/ICC-Profile-Rebuilder.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ICC-Profile-Rebuilder.exe" | Set-Content -Encoding ascii dist/ICC-Profile-Rebuilder.exe.sha256
          Compress-Archive -Path dist/* -DestinationPath ICC-Profile-Rebuilder-Windows-x64.zip
      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'color-convert-rust' | Select-Object -ExpandProperty version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) { throw "Tag does not match Cargo version" }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release already exists; immutable version skipped."; exit 0 }
          gh release create $tag dist/ICC-Profile-Rebuilder.exe dist/ICC-Profile-Rebuilder.exe.sha256 ICC-Profile-Rebuilder-Windows-x64.zip --target $env:GITHUB_SHA --generate-notes --title "ICC Profile Rebuilder $version"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ICC-Profile-Rebuilder-Windows-x64
          path: dist/
          if-no-files-found: error
