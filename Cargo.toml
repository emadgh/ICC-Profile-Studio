[package]
name = "color-convert-rust"
version = "0.2.2"
edition = "2021"
default-run = "icc-profile-studio"
autobins = false

[features]
default = ["studio"]
studio = ["dep:gpui"]

[[bin]]
name = "icc-profile-studio"
path = "src/bin/studio.rs"
required-features = ["studio"]

[dependencies]
gpui = { version = "=0.2.2", optional = true }
tiff = "0.11"
csv = "1.3"
flate2 = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-bidi = "0.3"
arabic_reshaper = "0.4.2"
lcms2 = { version = "6.3", features = ["static"] }
rfd = "0.15.3"
tempfile = "3.15"

image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinHttp", "Win32_UI_Shell"] }
update-via-github = { git = "https://github.com/emadgh/update-via-github.git", rev = "ec648957782ab800e14ddc6e0a15c694a46f1252" }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
